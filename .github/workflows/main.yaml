name: Deploy to production

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  SITE_DOMAIN: sheetmaxxing.com
  SITE_HOSTED_ZONE_ID: ${{ vars.SITE_HOSTED_ZONE_ID }}
  LEGACY_DOMAIN_NAME: louisracicot.com
  LEGACY_SUB_DOMAIN: sheetmaxxing
  LEGACY_ALT_SUB_DOMAIN: opticutter
  LEGACY_HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}

permissions:
  id-token: write
  contents: read

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
      - name: Sts GetCallerIdentity
        run: aws sts get-caller-identity
      - name: deploy
        run: |
          CERT_ARN=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name opticutter-static-website-certificate \
            --query "Stacks[0].Outputs[?OutputKey=='CertificateArn'].OutputValue | [0]" \
            --output text 2>/dev/null || true)

          NEED_CERT_DEPLOY=true
          if [ -n "$CERT_ARN" ] && [ "$CERT_ARN" != "None" ]; then
            CURRENT_CERT_DOMAIN=$(aws acm describe-certificate \
              --region "$AWS_REGION" \
              --certificate-arn "$CERT_ARN" \
              --query 'Certificate.DomainName' \
              --output text)
            if [ "$CURRENT_CERT_DOMAIN" = "$SITE_DOMAIN" ]; then
              NEED_CERT_DEPLOY=false
              echo "Certificate already issued for $SITE_DOMAIN"
            fi
          fi

          if [ "$NEED_CERT_DEPLOY" = true ]; then
            aws cloudformation deploy \
              --template-file cloud/certificate.cfn.yaml \
              --region "$AWS_REGION" \
              --stack-name opticutter-static-website-certificate \
              --parameter-overrides \
                DomainName="$SITE_DOMAIN" \
                HostedZoneId="$SITE_HOSTED_ZONE_ID"

            CERT_ARN=$(aws cloudformation describe-stacks \
              --region "$AWS_REGION" \
              --stack-name opticutter-static-website-certificate \
              --query "Stacks[0].Outputs[?OutputKey=='CertificateArn'].OutputValue | [0]" \
              --output text)
          fi

          BUCKET_NAME=$(aws cloudformation describe-stack-resource \
            --region "$AWS_REGION" \
            --stack-name opticutter-static-website \
            --logical-resource-id RootBucket \
            --query StackResourceDetail.PhysicalResourceId \
            --output text 2>/dev/null || true)

          if [ -n "$BUCKET_NAME" ] && [ "$BUCKET_NAME" != "None" ]; then
            BUCKET_DOMAIN=$(aws s3api get-bucket-location --bucket "$BUCKET_NAME" --output text)
            if [ "$BUCKET_DOMAIN" = "None" ] || [ -z "$BUCKET_DOMAIN" ]; then
              BUCKET_REGION="us-east-1"
            else
              BUCKET_REGION="$BUCKET_DOMAIN"
            fi
            ORIGIN_BUCKET_DOMAIN="${BUCKET_NAME}.s3.${BUCKET_REGION}.amazonaws.com"

            aws cloudformation deploy \
              --template-file cloud/legacy-redirect.cfn.yaml \
              --region "$AWS_REGION" \
              --stack-name opticutter-legacy-redirect \
              --parameter-overrides \
                LegacyDomainName="$LEGACY_DOMAIN_NAME" \
                LegacySubDomain="$LEGACY_SUB_DOMAIN" \
                AltLegacySubDomain="$LEGACY_ALT_SUB_DOMAIN" \
                SiteDomainName="$SITE_DOMAIN" \
                HostedZoneId="$LEGACY_HOSTED_ZONE_ID" \
                OriginBucketDomainName="$ORIGIN_BUCKET_DOMAIN"

            LEGACY_DISTR_ID=$(aws cloudformation describe-stack-resource \
              --region "$AWS_REGION" \
              --stack-name opticutter-legacy-redirect \
              --logical-resource-id CloudFrontDistribution \
              --query StackResourceDetail.PhysicalResourceId \
              --output text 2>/dev/null || true)

            if [ -n "$LEGACY_DISTR_ID" ] && [ "$LEGACY_DISTR_ID" != "None" ]; then
              aws cloudfront wait distribution-deployed --id "$LEGACY_DISTR_ID"
            fi
          fi

          aws cloudformation deploy \
            --template-file cloud/stack.cfn.yaml \
            --region "$AWS_REGION" \
            --stack-name opticutter-static-website \
            --parameter-overrides \
              DomainName="$SITE_DOMAIN" \
              CertificateArn="$CERT_ARN" \
              HostedZoneId="$SITE_HOSTED_ZONE_ID"

          DISTR_ID=$(aws cloudformation describe-stack-resource \
            --region "$AWS_REGION" \
            --stack-name opticutter-static-website \
            --logical-resource-id CloudFrontDistribution \
            --query StackResourceDetail.PhysicalResourceId \
            --output text)

          aws s3 sync . "s3://$BUCKET_NAME" --exclude ".git*/*" --exclude "cloud/*" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$DISTR_ID" \
            --paths "/*"
        shell: bash
